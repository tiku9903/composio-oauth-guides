# One-click deploy on Render (free plan): New > Blueprint > pick this repo.
# Secrets are `sync: false`: Render asks for them in the dashboard and they are never stored in git.
services:
  - type: web
    name: oauth-app-readiness
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: MODEL
        value: google_genai:gemini-3.8-flash
      - key: FAST_MODEL
        value: google_genai:gemini-3.5-flash-lite
      - key: EXTRACT_CONCURRENCY
        value: "2"
      - key: GEMINI_API_KEY        # free: https://aistudio.google.com/apikey
        sync: false
      - key: TAVILY_API_KEY        # free: https://app.tavily.com
        sync: false
      - key: COMPOSIO_API_KEY      # optional
        sync: false
